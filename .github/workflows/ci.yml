name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend (tsc + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  rust:
    name: Rust (test + clippy) / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # tauri::generate_context! 要求 frontendDist (../dist) 存在
      - name: Prepare frontend dist placeholder
        shell: bash
        run: mkdir -p dist && touch dist/index.html

      - name: Clippy
        shell: bash
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

      - name: Test
        shell: bash
        run: cargo test
        working-directory: src-tauri
