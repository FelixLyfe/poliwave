[package]
name = "wifi-analyzer"
version = "0.1.5"
description = "Desktop WiFi signal analyzer"
authors = ["Codex"]
edition = "2021"

[lib]
name = "wifi_analyzer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-location = { version = "0.3.2", default-features = false, features = ["CLLocationManager"] }
objc2-core-wlan = { version = "0.3.2", default-features = false, features = ["std", "CWChannel", "CWInterface", "CWNetwork", "CWWiFiClient", "CoreWLANTypes"] }
